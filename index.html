// 8 June 2026 is a Week B Monday, so Week A anchor is one week later (15 June) or one week before (1 June)
// We anchor to a known Week A Monday: 1 June 2026
const WEEK_A_ANCHOR = new Date('2026-06-01T00:00:00');
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAY_FULL = { Mon:'Monday', Tue:'Tuesday', Wed:'Wednesday', Thu:'Thursday', Fri:'Friday' };

function getWeekAB(date) {
  const msPerWeek = 7 * 24 * 60 * 60 * 1000;
  const monday = new Date(date);
  monday.setHours(0,0,0,0);
  const day = monday.getDay();
  monday.setDate(monday.getDate() - (day === 0 ? 6 : day - 1));
  const weeksSince = Math.round((monday - WEEK_A_ANCHOR) / msPerWeek);
  return weeksSince % 2 === 0 ? 'A' : 'B';
}

const now = new Date();
const week = getWeekAB(now);
const dayKey = DAYS[now.getDay()];
const isWeekend = now.getDay() === 0 || now.getDay() === 6;

let text = '';

if (isWeekend) {
  text = `It is the weekend. No school today. Next week is Week ${week === 'A' ? 'B' : 'A'}.`;
} else if (TIMETABLE[week][dayKey]) {
  const lessons = TIMETABLE[week][dayKey];
  const dayName = DAY_FULL[dayKey];
  text = `Today is ${dayName}, Week ${week}. You have ${lessons.length} lessons. `;
  lessons.forEach((l, i) => {
    text += `Lesson ${i + 1}: ${l.subject}, ${l.time}, room ${l.room}. `;
  });
} else {
  text = `No timetable found for today.`;
}

document.getElementById('output').textContent = text;
