<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Olly's Timetable</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0f;
    --surface: #1a1a1d;
    --border: #2a2a2e;
    --accent-a: #7effa0;
    --accent-b: #7ec8ff;
    --text: #f0f0f0;
    --muted: #888;
    --today: #ffffff10;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1.5rem 4rem;
  }

  header {
    margin-bottom: 2.5rem;
  }

  .week-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.4rem 1rem;
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 1rem;
    letter-spacing: 0.05em;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: clamp(2rem, 8vw, 3.5rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.03em;
  }

  .week-label {
    color: var(--accent);
  }

  .date-line {
    margin-top: 0.5rem;
    font-size: 0.8rem;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  /* Siri-readable hidden text */
  .siri-summary {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
  }

  /* Today's lessons - shown prominently */
  .today-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.5rem;
    margin-bottom: 2rem;
    position: relative;
    overflow: hidden;
  }

  .today-section::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), transparent);
  }

  .section-label {
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 1rem;
  }

  .lesson-list {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .lesson {
    display: grid;
    grid-template-columns: 90px 1fr auto;
    align-items: center;
    gap: 1rem;
    padding: 0.75rem 1rem;
    background: var(--today);
    border-radius: 10px;
    border: 1px solid var(--border);
    transition: border-color 0.2s;
  }

  .lesson:hover {
    border-color: var(--accent);
  }

  .lesson-time {
    font-size: 0.72rem;
    color: var(--muted);
    white-space: nowrap;
  }

  .lesson-subject {
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--text);
  }

  .lesson-room {
    font-size: 0.72rem;
    color: var(--accent);
    text-align: right;
    white-space: nowrap;
  }

  .lesson-teacher {
    font-size: 0.72rem;
    color: var(--muted);
    grid-column: 2;
    margin-top: -0.3rem;
  }

  .lesson-grid-row {
    display: contents;
  }

  /* Full week grid */
  .week-grid {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }

  .day-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .day-row.is-today {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent)22;
  }

  .day-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.75rem 1rem;
    cursor: pointer;
    user-select: none;
  }

  .day-name {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
  }

  .day-row.is-today .day-name {
    color: var(--accent);
  }

  .day-chevron {
    color: var(--muted);
    font-size: 0.8rem;
    transition: transform 0.2s;
  }

  .day-content {
    display: none;
    padding: 0 1rem 1rem;
    flex-direction: column;
    gap: 0.4rem;
  }

  .day-content.open {
    display: flex;
  }

  .day-row.is-today .day-content {
    display: flex;
  }

  .mini-lesson {
    display: grid;
    grid-template-columns: 85px 1fr auto;
    align-items: center;
    gap: 0.75rem;
    padding: 0.5rem 0.5rem;
    border-radius: 8px;
    font-size: 0.78rem;
  }

  .mini-lesson:hover {
    background: var(--today);
  }

  .mini-time { color: var(--muted); }
  .mini-subject { font-weight: 500; }
  .mini-room { color: var(--accent); text-align: right; }

  .tab-bar {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
  }

  .tab {
    flex: 1;
    padding: 0.5rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.03em;
  }

  .tab.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
    font-weight: 500;
  }

  .week-panel { display: none; }
  .week-panel.active { display: block; }
</style>
</head>
<body>

<!-- Hidden Siri-readable summary at top of page -->
<div id="siri-text" style="font-size:1.1rem; line-height:1.8; color:#f0f0f0; margin-bottom:2rem; padding:1rem; background:#1a1a1d; border-radius:12px;"></div>

<header>
  <div class="week-badge">
    <span class="dot" id="live-dot"></span>
    <span id="live-label">Loading...</span>
  </div>
  <h1>Week <span class="week-label" id="week-letter">...</span></h1>
  <div class="date-line" id="date-line">—</div>
</header>

<div class="tab-bar">
  <button class="tab active" onclick="switchWeek('A')">Week A</button>
  <button class="tab" onclick="switchWeek('B')">Week B</button>
</div>

<div id="week-A" class="week-panel active"></div>
<div id="week-B" class="week-panel"></div>

<script>
const TIMETABLE = {
  A: {
    Mon: [
      { time: "08:55–10:00", subject: "English", teacher: "Ms V Liu", room: "202" },
      { time: "10:00–11:05", subject: "Science", teacher: "Miss L Grant", room: "104" },
      { time: "11:25–12:30", subject: "Jewish History", teacher: "Mr T Nagus", room: "502" },
      { time: "13:10–14:15", subject: "Maths", teacher: "Mr J Devan", room: "314" },
      { time: "14:30–15:35", subject: "Art", teacher: "Mrs H Chweidan", room: "209" },
    ],
    Tue: [
      { time: "08:55–10:00", subject: "Limudei Kodesh", teacher: "Mr B Kagan", room: "507" },
      { time: "10:00–11:05", subject: "Geography", teacher: "Mr M Cripps", room: "113" },
      { time: "11:25–12:30", subject: "History", teacher: "Mr D Webb", room: "110" },
      { time: "13:10–14:15", subject: "Music", teacher: "Mrs J Moore", room: "501" },
      { time: "14:30–15:35", subject: "English", teacher: "Ms V Liu", room: "202" },
    ],
    Wed: [
      { time: "08:55–10:00", subject: "Maths", teacher: "Mr J Devan", room: "314" },
      { time: "10:00–11:05", subject: "IJE", teacher: "Mr Y Spector", room: "504" },
      { time: "11:25–12:30", subject: "English", teacher: "Ms V Liu", room: "202" },
      { time: "13:10–14:15", subject: "Computing", teacher: "Mr A Bronstein", room: "207" },
      { time: "14:30–15:35", subject: "French", teacher: "Mrs S Fernandes", room: "212" },
    ],
    Thu: [
      { time: "08:55–10:00", subject: "Jewish History", teacher: "Mr M Cohen", room: "105" },
      { time: "10:00–11:05", subject: "History", teacher: "Mr D Webb", room: "110" },
      { time: "11:25–12:30", subject: "Ivrit", teacher: "Mrs N Fialkov", room: "405" },
      { time: "13:10–14:15", subject: "Drama", teacher: "Mrs N Stimler", room: "109" },
      { time: "14:30–15:35", subject: "PE", teacher: "Mr J Farrell", room: "GYM" },
    ],
    Fri: [
      { time: "08:40–09:45", subject: "PSHCE", teacher: "Ms L Shaya", room: "206" },
      { time: "09:45–10:50", subject: "Limudei Kodesh", teacher: "Mr B Kagan", room: "507" },
      { time: "11:20–12:25", subject: "Maths", teacher: "Mr J Devan", room: "314" },
      { time: "12:25–13:30", subject: "Science", teacher: "Miss L Grant", room: "104" },
    ],
  },
  B: {
    Mon: [
      { time: "08:55–10:00", subject: "English", teacher: "Ms V Liu", room: "202" },
      { time: "10:00–11:05", subject: "Maths", teacher: "Mr J Devan", room: "314" },
      { time: "11:25–12:30", subject: "French", teacher: "Mrs S Fernandes", room: "212" },
      { time: "13:10–14:15", subject: "Technology", teacher: "Mrs N Cohen", room: "403" },
      { time: "14:30–15:35", subject: "Science", teacher: "Miss L Grant", room: "104" },
    ],
    Tue: [
      { time: "08:55–10:00", subject: "PE", teacher: "Mr J Farrell", room: "GYM" },
      { time: "10:00–11:05", subject: "Technology", teacher: "Mrs N Cohen", room: "403" },
      { time: "11:25–12:30", subject: "Limudei Kodesh", teacher: "Mr B Kagan", room: "507" },
      { time: "13:10–14:15", subject: "Geography", teacher: "Mr M Cripps", room: "113" },
      { time: "14:30–15:35", subject: "Ivrit", teacher: "Mrs N Fialkov", room: "405" },
    ],
    Wed: [
      { time: "08:55–10:00", subject: "Art", teacher: "Mrs H Chweidan", room: "209" },
      { time: "10:00–11:05", subject: "Computing", teacher: "Mr A Bronstein", room: "207" },
      { time: "11:25–12:30", subject: "PE", teacher: "Mr J Farrell", room: "GYM" },
      { time: "13:10–14:15", subject: "Music", teacher: "Mrs J Moore", room: "501" },
      { time: "14:30–15:35", subject: "Geography", teacher: "Mr M Cripps", room: "113" },
    ],
    Thu: [
      { time: "08:55–10:00", subject: "English", teacher: "Ms V Liu", room: "202" },
      { time: "10:00–11:05", subject: "History", teacher: "Mr D Webb", room: "110" },
      { time: "11:25–12:30", subject: "Ivrit", teacher: "Mrs N Fialkov", room: "405" },
      { time: "13:10–14:15", subject: "Science", teacher: "Miss L Grant", room: "104" },
      { time: "14:30–15:35", subject: "Maths", teacher: "Mr J Devan", room: "314" },
    ],
    Fri: [
      { time: "08:40–09:45", subject: "PSHCE", teacher: "Ms L Shaya", room: "206" },
      { time: "09:45–10:50", subject: "Science", teacher: "Miss L Grant", room: "104" },
      { time: "11:20–12:25", subject: "Limudei Kodesh", teacher: "Mr B Kagan", room: "507" },
      { time: "12:25–13:30", subject: "French", teacher: "Mrs S Fernandes", room: "212" },
    ],
  }
};

// ── Week A/B detection ──────────────────────────────────────────────
// Set a known Week A Monday as the anchor date.
// From the timetable, Week A starts on a known date — we'll use a reference.
// The school year typically starts Week A. We anchor to 2025-09-01 (Mon) as Week A.
const WEEK_A_ANCHOR = new Date('2026-06-01T00:00:00'); // 1 Jun 2026 = Week A Monday

function getWeekAB(date) {
  const msPerWeek = 7 * 24 * 60 * 60 * 1000;
  const monday = new Date(date);
  monday.setHours(0,0,0,0);
  // Roll back to Monday
  const day = monday.getDay();
  monday.setDate(monday.getDate() - (day === 0 ? 6 : day - 1));
  const weeksSinceAnchor = Math.round((monday - WEEK_A_ANCHOR) / msPerWeek);
  return weeksSinceAnchor % 2 === 0 ? 'A' : 'B';
}

const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAY_FULL = { Mon:'Monday', Tue:'Tuesday', Wed:'Wednesday', Thu:'Thursday', Fri:'Friday' };

function formatDate(d) {
  return d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}

// ── Build UI ────────────────────────────────────────────────────────
function buildWeekPanel(week) {
  const panel = document.getElementById(`week-${week}`);
  panel.innerHTML = '';
  const todayDay = DAYS[new Date().getDay()];
  const currentWeek = getWeekAB(new Date());

  Object.entries(TIMETABLE[week]).forEach(([day, lessons]) => {
    const isToday = day === todayDay && week === currentWeek;
    const row = document.createElement('div');
    row.className = 'day-row' + (isToday ? ' is-today' : '');

    const header = document.createElement('div');
    header.className = 'day-header';
    header.innerHTML = `<span class="day-name">${DAY_FULL[day]}${isToday ? ' · TODAY' : ''}</span><span class="day-chevron" id="chev-${week}-${day}">▾</span>`;
    header.onclick = () => toggle(week, day);

    const content = document.createElement('div');
    content.className = 'day-content' + (isToday ? ' open' : '');
    content.id = `dc-${week}-${day}`;

    lessons.forEach(l => {
      const m = document.createElement('div');
      m.className = 'mini-lesson';
      m.innerHTML = `<span class="mini-time">${l.time}</span><span class="mini-subject">${l.subject}<br><span style="font-weight:400;color:var(--muted);font-size:0.7rem">${l.teacher}</span></span><span class="mini-room">${l.room}</span>`;
      content.appendChild(m);
    });

    row.appendChild(header);
    row.appendChild(content);
    panel.appendChild(row);
  });
}

function toggle(week, day) {
  const content = document.getElementById(`dc-${week}-${day}`);
  const chev = document.getElementById(`chev-${week}-${day}`);
  const open = content.classList.toggle('open');
  chev.style.transform = open ? 'rotate(180deg)' : '';
}

function switchWeek(w) {
  document.querySelectorAll('.week-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`week-${w}`).classList.add('active');
  document.querySelectorAll('.tab')[w === 'A' ? 0 : 1].classList.add('active');
}

// ── Init ────────────────────────────────────────────────────────────
function init() {
  const now = new Date();
  const week = getWeekAB(now);
  const dayIdx = now.getDay();
  const dayName = DAYS[dayIdx];
  const isWeekend = dayIdx === 0 || dayIdx === 6;

  // Set accent color based on week
  document.documentElement.style.setProperty('--accent', week === 'A' ? 'var(--accent-a)' : 'var(--accent-b)');

  document.getElementById('week-letter').textContent = week;
  document.getElementById('date-line').textContent = formatDate(now);
  document.getElementById('live-label').textContent = `Week ${week} · Live`;

  // Build both panels
  buildWeekPanel('A');
  buildWeekPanel('B');

  // Make the correct week tab active
  switchWeek(week);

  // ── Siri-readable summary ──────────────────────────────────────────
  let siriText = `Today is ${formatDate(now)}. This is Week ${week}. `;

  if (isWeekend) {
    siriText += `It's the weekend — no school today. `;
    const nextDay = week === 'A' ? 'A' : 'B';
    const monLessons = TIMETABLE[week].Mon;
    siriText += `On Monday (Week ${nextDay}): ` + monLessons.map(l => `${l.subject} in room ${l.room}`).join(', ') + '.';
  } else if (TIMETABLE[week][dayName]) {
    const lessons = TIMETABLE[week][dayName];
    siriText += `Today's lessons are: `;
    siriText += lessons.map(l => `${l.subject} at ${l.time} in room ${l.room} with ${l.teacher}`).join('. ') + '.';
  } else {
    siriText += `No lessons found for today.`;
  }

  document.getElementById('siri-text').textContent = siriText;
}

init();
</script>
</body>
</html>
